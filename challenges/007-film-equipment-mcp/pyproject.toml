[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "film-equipment-mcp"
version = "0.1.0"
description = "Synthetic film equipment inventory API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "mcp[cli]==1.12.4",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gear_rental = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
